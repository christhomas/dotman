name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # `version: latest` took whatever goreleaser had most recently shipped, and
      # goreleaser removes deprecated configuration in minor releases — so a
      # release could break with no change to this repository and no warning at
      # all. Bounding it to the 2.17 series still picks up patch fixes, and moving
      # to a new minor becomes a deliberate edit that CI validates first.
      #
      # Not pinned to an exact patch: dependabot updates `uses:` refs but not an
      # action's `version` input, so an exact pin would go stale unnoticed.
      #
      # No tap token: the release no longer writes into the Homebrew tap, so it
      # needs no credential for any repository but this one.
      #
      # The secret has since been deleted from this repository, and the tap's CI
      # rejects a formula or cask carrying a generator's DO-NOT-EDIT banner —
      # which is what a re-added publisher would write. So re-adding one here
      # fails its own release for want of a credential, and would be caught at
      # the tap even if it had one.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2.17'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
